name: Check deployment configuration
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test SHA selection and publication gates
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python3 -m py_compile scripts/*.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Test webhook and isolated leaderboard
        run: node --test tests/*.test.mjs
      - name: Install locked browser verification dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify exported leaderboard page and existing browser clients
        run: |
          node tests/leaderboard-page-browser.mjs --screenshots "$RUNNER_TEMP/leaderboard-page"
          node tests/leaderboard-ui-browser.mjs
          node tests/profile-focus-browser.mjs
          node tests/leaderboard-api-browser.mjs
      - name: Retain failed leaderboard page screenshots only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leaderboard-page-${{ github.sha }}
          path: ${{ runner.temp }}/leaderboard-page/*.png
          retention-days: 1
          if-no-files-found: ignore
