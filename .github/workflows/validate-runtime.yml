name: Validate Web build

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out current source main with read-only access
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: python3 scripts/source.py --validate --directory "$RUNNER_TEMP/private-source"
      - name: Install checksum-verified Godot and Web templates
        run: python3 scripts/install_godot.py --directory "$RUNNER_TEMP/godot"
      - name: Build Web release and audit public artifacts
        run: python3 scripts/build.py --source "$RUNNER_TEMP/private-source" --output "$RUNNER_TEMP/site"
