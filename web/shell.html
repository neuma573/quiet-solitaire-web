<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$GODOT_PROJECT_NAME</title>
  <link rel="stylesheet" href="leaderboard.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; background: #e9e9e9; }
    #phone { position: fixed; width: 390px; height: 760px; }
    #canvas { display: block; width: 100%; height: 100%; border: 0; background: #f5f5f5; touch-action: none; }
    #canvas:focus { outline: none; }
    /* The game's My Page opens the overlay; a floating button would cover HUD counters. */
    #phone .ql-launcher { display: none; }
    #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #f5f5f5; }
    #status-progress { width: 50%; }
    #status-notice { margin: 24px; color: #333; font: 16px/1.5 system-ui, sans-serif; white-space: pre-line; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <div id="phone">
    <canvas id="canvas" width="390" height="760">Your browser does not support canvas.</canvas>
    <div id="status">
      <progress id="status-progress" aria-label="Loading game"></progress>
      <p id="status-notice" role="alert" hidden></p>
    </div>
  </div>
  <noscript>JavaScript is required to play.</noscript>
  <script type="module" src="leaderboard.mjs"></script>
  <script src="$GODOT_URL"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const phone = document.getElementById('phone');
    function fitPhone() {
      const density = window.devicePixelRatio || 1;
      // The dialog owns keyboard scrolling. Keep Godot in the layout viewport:
      // keyboard/pinch metrics must not resize its buffer or leave a stale pan
      // offset when iOS restores the visual viewport in a later scroll event.
      const width = document.documentElement.clientWidth || window.innerWidth;
      const height = document.documentElement.clientHeight || window.innerHeight;
      const portrait = width <= 600 && height > width;
      const scale = Math.min(portrait ? Infinity : 1, width / 390, height / 760);
      let displayWidth = 390 * scale, displayHeight = 760 * scale;
      let pixelsWide, pixelsHigh;
      if (portrait) {
        // Godot's existing canvas_items/expand layout grows its logical width
        // instead of clipping the board or stretching card shapes.
        displayWidth = width;
        pixelsWide = Math.max(1, Math.ceil(displayWidth * density));
        pixelsHigh = Math.max(1, Math.floor(height * pixelsWide / displayWidth));
        // Match the CSS and backing aspect exactly. Pixel rounding can leave
        // less than one device pixel vertically, never horizontal gutters.
        displayHeight = displayWidth * pixelsHigh / pixelsWide;
      } else {
        const blocks = Math.ceil(10 * density * Math.max(1, scale));
        pixelsWide = 39 * blocks;
        pixelsHigh = 76 * blocks;
      }
      if (canvas.width !== pixelsWide) canvas.width = pixelsWide;
      if (canvas.height !== pixelsHigh) canvas.height = pixelsHigh;
      phone.style.width = `${displayWidth}px`;
      phone.style.height = `${displayHeight}px`;
      phone.style.left = `${(width - displayWidth) / 2}px`;
      phone.style.top = `${(height - displayHeight) / 2}px`;
    }
    fitPhone();
    window.addEventListener('resize', fitPhone);

    const config = $GODOT_CONFIG;
    const engine = new Engine(config);
    const progress = document.getElementById('status-progress');
    function failed(error) {
      console.error(error);
      progress.hidden = true;
      const notice = document.getElementById('status-notice');
      notice.textContent = error instanceof Error ? error.message : String(error);
      notice.hidden = false;
    }
    const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
    if (missing.length) {
      failed(new Error('Required browser features are missing:\n' + missing.join('\n')));
    } else {
      engine.startGame({ canvas, onProgress(current, total) {
        if (total > 0) { progress.value = current; progress.max = total; }
        else { progress.removeAttribute('value'); }
      } }).then(() => document.getElementById('status').remove(), failed);
    }
  </script>
</body>
</html>
